"attribute" = "#5ac1fe"
"boolean" = "#d2a6ff"
"comment" = "#5c6773"
"comment.doc" = "#8c8b88"
"constant" = "#d2a6ff"
"constructor" = "#5ac1fe"
"diff.minus" = "#f07178"
"diff.plus" = "#aad94c"
"embedded" = "#bfbdb6"
"emphasis" = "#5ac1fe"
"emphasis.strong" = "#5ac1fe"
"enum" = "#fe8f40"
"function" = "#ffb353"
"hint" = "#628b80"
"keyword" = "#ff8f3f"
"label" = "#5ac1fe"
"link_text" = "#fe8f40"
"link_uri" = "#aad84c"
"namespace" = "#bfbdb6"
"number" = "#d2a6ff"
"operator" = "#f29668"
"predictive" = "#5a728b"
"preproc" = "#ff8f3f"
"primary" = "#bfbdb6"
"property" = "#5ac1fe"
"punctuation" = "#a6a5a0"
"punctuation.bracket" = "#a6a5a0"
"punctuation.delimiter" = "#a6a5a0"
"punctuation.list_marker" = "#a6a5a0"
"punctuation.markup" = "#a6a5a0"
"punctuation.special" = "#d2a6ff"
"selector" = "#d2a6ff"
"selector.pseudo" = "#5ac1fe"
"string" = "#a9d94b"
