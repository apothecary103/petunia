# Ayu Dark, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "Ayu Dark"
appearance = "dark"

background = "#0d1016"
surface = "#1f2127"
elevated = "#1f2127"
sunken = "#0d1016"
border = "#3f4043"
border_focus = "#1b4a6e"

text = "#bfbdb6"
text_dim = "#8a8986"
text_muted = "#696a6a"

hover = "#2d2f34"
active = "#3e4043"
selected = "#3e4043"

accent = "#5ac1fe"
on_accent = "#0d1016"
success = "#aad84c"
warning = "#feb454"
danger = "#ef7177"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#5ac1fe", "#39bae5", "#fe8f40", "#d2a6fe", "#95e5cb", "#ef7177", "#feb454", "#aad84c"]

# What a code block is coloured with, straight from Zed's own syntax palette.
