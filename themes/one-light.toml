"constant" = "#c18401"
"constructor" = "#5c78e2"
"diff.minus" = "#e45649"
"diff.plus" = "#50a14f"
"embedded" = "#242529"
"emphasis" = "#5c78e2"
"emphasis.strong" = "#ad6e25"
"enum" = "#3882b7"
"function" = "#5b79e3"
"hint" = "#7274a7"
"keyword" = "#a449ab"
"label" = "#5c78e2"
"link_text" = "#5b79e3"
"link_uri" = "#3882b7"
"namespace" = "#242529"
"number" = "#ad6e25"
"operator" = "#3882b7"
"predictive" = "#9b9ec6"
"preproc" = "#a449ab"
"primary" = "#242529"
"property" = "#d3604f"
"punctuation" = "#242529"
"punctuation.bracket" = "#4d4f52"
"punctuation.delimiter" = "#4d4f52"
"punctuation.list_marker" = "#d3604f"
"punctuation.markup" = "#d3604f"
"punctuation.special" = "#b92b46"
"selector" = "#669f59"
"selector.pseudo" = "#5c78e2"
