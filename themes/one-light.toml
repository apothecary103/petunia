# One Light, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "One Light"
appearance = "light"

background = "#fafafa"
surface = "#ebebec"
elevated = "#ebebec"
sunken = "#fafafa"
border = "#c9c9ca"
border_focus = "#7d82e8"

text = "#242529"
text_dim = "#58585a"
text_muted = "#7e8086"

hover = "#dfdfe0"
active = "#cacaca"
selected = "#cacaca"

accent = "#5c78e2"
on_accent = "#fafafa"
success = "#669f59"
warning = "#a48819"
danger = "#d36151"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#5c78e2", "#984ea5", "#ad6e26", "#a349ab", "#3a82b7", "#d36151", "#a48819", "#669f59"]

# What a code block is coloured with, straight from Zed's own syntax palette.
