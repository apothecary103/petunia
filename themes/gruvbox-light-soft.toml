# Gruvbox Light Soft, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "Gruvbox Light Soft"
appearance = "light"

background = "#f2e5bc"
surface = "#ecdcb3"
elevated = "#ecdcb3"
sunken = "#f2e5bc"
border = "#c8b899"
border_focus = "#adc5cc"

text = "#282828"
text_dim = "#5f5650"
text_muted = "#897b6e"

hover = "#ddcca7"
active = "#c8b899"
selected = "#c8b899"

accent = "#0b6678"
on_accent = "#f2e5bc"
success = "#797410"
warning = "#b57615"
danger = "#9d0308"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#0b6678", "#7c6f64", "#af3a04", "#8f3f70", "#437b59", "#9d0308", "#b57615", "#797410"]

# What a code block is coloured with, straight from Zed's own syntax palette.
[syntax]
"attribute" = "#0b6678"
"boolean" = "#8f3e71"
"comment" = "#7c6f64"
"comment.doc" = "#5d544e"
"constant" = "#b57613"
"constructor" = "#0b6678"
"diff.minus" = "#9d0006"
"diff.plus" = "#79740e"
"embedded" = "#427b58"
"emphasis" = "#0b6678"
"emphasis.strong" = "#0b6678"
"enum" = "#af3a02"
"function" = "#79740e"
"function.builtin" = "#9d0006"
"hint" = "#677562"
"keyword" = "#9d0006"
"label" = "#0b6678"
"link_text" = "#427b58"
"link_uri" = "#8f3e71"
"namespace" = "#066578"
"number" = "#8f3e71"
"operator" = "#427b58"
"predictive" = "#7c9780"
"preproc" = "#9d0006"
"primary" = "#282828"
"property" = "#282828"
"punctuation" = "#3c3836"
"punctuation.bracket" = "#665c54"
"punctuation.delimiter" = "#413d3a"
"punctuation.list_marker" = "#282828"
"punctuation.markup" = "#066578"
"punctuation.special" = "#413d3a"
"selector" = "#b57613"
"selector.pseudo" = "#0b6678"
"string" = "#79740e"
"string.escape" = "#5d544e"
"string.regex" = "#af3a02"
"string.special" = "#8f3e71"
"string.special.symbol" = "#427b58"
"tag" = "#427b58"
"text.literal" = "#066578"
"title" = "#79740e"
"type" = "#b57613"
"variable" = "#282828"
"variable.parameter" = "#076678"
"variable.special" = "#066578"
"variant" = "#0b6678"
