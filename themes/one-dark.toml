# One Dark, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "One Dark"
appearance = "dark"

background = "#282c33"
surface = "#2f343e"
elevated = "#2f343e"
sunken = "#282c33"
border = "#464b57"
border_focus = "#47679e"

text = "#dce0e5"
text_dim = "#a9afbc"
text_muted = "#878a98"

hover = "#363c46"
active = "#454a56"
selected = "#454a56"

accent = "#74ade8"
on_accent = "#282c33"
success = "#a1c181"
warning = "#dec184"
danger = "#d07277"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#74ade8", "#be5046", "#bf956a", "#b477cf", "#6eb4bf", "#d07277", "#dec184", "#a1c181"]

# What a code block is coloured with, straight from Zed's own syntax palette.
[syntax]
"attribute" = "#74ade8"
"boolean" = "#bf956a"
"comment" = "#5d636f"
"comment.doc" = "#878e98"
"constant" = "#dfc184"
"constructor" = "#73ade9"
"diff.minus" = "#e06c75"
"diff.plus" = "#98c379"
"embedded" = "#dce0e5"
"emphasis" = "#74ade8"
"emphasis.strong" = "#bf956a"
"enum" = "#6eb4bf"
"function" = "#73ade9"
"hint" = "#788ca6"
"keyword" = "#b477cf"
"label" = "#74ade8"
"link_text" = "#73ade9"
"link_uri" = "#6eb4bf"
"namespace" = "#dce0e5"
"number" = "#bf956a"
"operator" = "#6eb4bf"
"predictive" = "#5a6a87"
"preproc" = "#b477cf"
"primary" = "#acb2be"
"property" = "#d07277"
"punctuation" = "#acb2be"
"punctuation.bracket" = "#b2b9c6"
"punctuation.delimiter" = "#b2b9c6"
"punctuation.list_marker" = "#d07277"
"punctuation.markup" = "#d07277"
"punctuation.special" = "#b1574b"
"selector" = "#dfc184"
"selector.pseudo" = "#74ade8"
"string" = "#a1c181"
"string.escape" = "#878e98"
"string.regex" = "#bf956a"
"string.special" = "#bf956a"
"string.special.symbol" = "#bf956a"
"tag" = "#74ade8"
"text.literal" = "#a1c181"
"title" = "#d07277"
"type" = "#6eb4bf"
"variable" = "#acb2be"
"variable.parameter" = "#d07277"
"variable.special" = "#bf956a"
"variant" = "#73ade9"
