# Ayu Mirage, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "Ayu Mirage"
appearance = "dark"

background = "#242835"
surface = "#353944"
elevated = "#353944"
sunken = "#242835"
border = "#53565d"
border_focus = "#24556f"

text = "#cccac2"
text_dim = "#9a9a98"
text_muted = "#7b7d7f"

hover = "#43464f"
active = "#53565d"
selected = "#53565d"

accent = "#72cffe"
on_accent = "#242835"
success = "#d5fe80"
warning = "#fecf72"
danger = "#f18779"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#72cffe", "#5bcde5", "#fead66", "#debffe", "#95e5cb", "#f18779", "#fecf72", "#d5fe80"]

# What a code block is coloured with, straight from Zed's own syntax palette.
[syntax]
"attribute" = "#72cffe"
"boolean" = "#dfbfff"
"comment" = "#5c6773"
"comment.doc" = "#9b9b99"
"constant" = "#dfbfff"
"constructor" = "#72cffe"
"diff.minus" = "#f07178"
"diff.plus" = "#aad94c"
"embedded" = "#cccac2"
"emphasis" = "#72cffe"
"emphasis.strong" = "#72cffe"
"enum" = "#fead66"
"function" = "#ffd173"
"hint" = "#7399a3"
"keyword" = "#ffad65"
"label" = "#72cffe"
"link_text" = "#fead66"
"link_uri" = "#d5fe80"
"namespace" = "#cccac2"
"number" = "#dfbfff"
"operator" = "#f29e74"
"predictive" = "#6d839b"
"preproc" = "#ffad65"
"primary" = "#cccac2"
"property" = "#72cffe"
"punctuation" = "#b4b3ae"
"punctuation.bracket" = "#b4b3ae"
"punctuation.delimiter" = "#b4b3ae"
"punctuation.list_marker" = "#b4b3ae"
"punctuation.markup" = "#b4b3ae"
"punctuation.special" = "#dfbfff"
"selector" = "#dfbfff"
"selector.pseudo" = "#72cffe"
"string" = "#d4fe7f"
"string.escape" = "#9b9b99"
"string.regex" = "#95e6cb"
"string.special" = "#ffdfb3"
"string.special.symbol" = "#fead66"
"tag" = "#72cffe"
"text.literal" = "#fead66"
"title" = "#cccac2"
"type" = "#73cfff"
"variable" = "#cccac2"
"variable.parameter" = "#dfbfff"
"variant" = "#72cffe"
