"constant" = "#fabd2e"
"constructor" = "#83a598"
"diff.minus" = "#fb4934"
"diff.plus" = "#b8bb26"
"embedded" = "#8ec07c"
"emphasis" = "#83a598"
"emphasis.strong" = "#83a598"
"enum" = "#fe7f18"
"function" = "#b8bb25"
"function.builtin" = "#fb4833"
"hint" = "#8c957d"
"keyword" = "#fb4833"
"label" = "#83a598"
"link_text" = "#8ec07c"
"link_uri" = "#d3869b"
"namespace" = "#83a598"
"number" = "#d3869b"
"operator" = "#8ec07c"
"predictive" = "#717363"
"preproc" = "#fb4833"
"primary" = "#ebdbb2"
"property" = "#ebdbb2"
"punctuation" = "#d5c4a1"
"punctuation.bracket" = "#a89984"
"punctuation.delimiter" = "#e5d5ad"
"punctuation.list_marker" = "#ebdbb2"
"punctuation.markup" = "#83a598"
"punctuation.special" = "#e5d5ad"
"selector" = "#fabd2e"
"selector.pseudo" = "#83a598"
