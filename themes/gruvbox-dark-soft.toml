# Gruvbox Dark Soft, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "Gruvbox Dark Soft"
appearance = "dark"

background = "#32302f"
surface = "#3b3735"
elevated = "#3b3735"
sunken = "#32302f"
border = "#5b534d"
border_focus = "#303a36"

text = "#fbf1c7"
text_dim = "#c5b597"
text_muted = "#998b78"

hover = "#494340"
active = "#5b524c"
selected = "#5b524c"

accent = "#83a598"
on_accent = "#32302f"
success = "#b7bb26"
warning = "#f9bd2f"
danger = "#fb4a35"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#83a598", "#a89984", "#fd801b", "#d3869b", "#8ec07c", "#fb4a35", "#f9bd2f", "#b7bb26"]

# What a code block is coloured with, straight from Zed's own syntax palette.
