# Ayu Light, converted from Zed's theme of the same name.
# Regenerate with script/zed-themes.py; hand edits here will be overwritten.
name = "Ayu Light"
appearance = "light"

background = "#fcfcfc"
surface = "#ececed"
elevated = "#ececed"
sunken = "#fcfcfc"
border = "#cfd1d2"
border_focus = "#c4daf6"

text = "#5c6166"
text_dim = "#8b8e92"
text_muted = "#a9acae"

hover = "#dfe0e1"
active = "#cfd0d2"
selected = "#cfd0d2"

accent = "#3b9ee5"
on_accent = "#fcfcfc"
success = "#85b304"
warning = "#f1ad49"
danger = "#ef7271"

# Sender colours, from Zed's player palette -- which exists for the same job.
accents = ["#3b9ee5", "#55b4d3", "#f98d3f", "#a37acc", "#4dbf99", "#ef7271", "#f1ad49", "#85b304"]

# What a code block is coloured with, straight from Zed's own syntax palette.
[syntax]
"attribute" = "#3b9ee5"
"boolean" = "#a37acc"
"comment" = "#abb0b6"
"comment.doc" = "#898d90"
"constant" = "#a37acc"
"constructor" = "#3b9ee5"
"diff.minus" = "#ff6666"
"diff.plus" = "#6cbf43"
"embedded" = "#5c6166"
"emphasis" = "#3b9ee5"
"emphasis.strong" = "#3b9ee5"
"enum" = "#f98d3f"
"function" = "#f2ad48"
"hint" = "#8ca7c2"
"keyword" = "#fa8d3e"
"label" = "#3b9ee5"
"link_text" = "#f98d3f"
"link_uri" = "#85b304"
"namespace" = "#5c6166"
"number" = "#a37acc"
"operator" = "#ed9365"
"predictive" = "#9eb9d3"
"preproc" = "#fa8d3e"
"primary" = "#5c6166"
"property" = "#3b9ee5"
"punctuation" = "#73777b"
"punctuation.bracket" = "#73777b"
"punctuation.delimiter" = "#73777b"
"punctuation.list_marker" = "#73777b"
"punctuation.markup" = "#73777b"
"punctuation.special" = "#a37acc"
"selector" = "#a37acc"
"selector.pseudo" = "#3b9ee5"
"string" = "#86b300"
"string.escape" = "#898d90"
"string.regex" = "#4bbf98"
"string.special" = "#e6ba7e"
"string.special.symbol" = "#f98d3f"
"tag" = "#3b9ee5"
"text.literal" = "#f98d3f"
"title" = "#5c6166"
"type" = "#389ee6"
"variable" = "#5c6166"
"variable.parameter" = "#a37acc"
"variant" = "#3b9ee5"
