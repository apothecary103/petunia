# A Petunia theme.
#
# Copy to ~/.config/petunia/themes/<name>.toml and select it with
# `theme = "<name>"` in config.toml. Every key is optional; anything you leave
# out keeps its value from the built-in dark theme, so a file that sets only an
# accent colour is perfectly valid.
#
# Colours accept #rgb, #rrggbb and #rrggbbaa, with or without the leading hash.

# Shown nowhere; the file name is what selects the theme.
name = "my-theme"
# "dark" or "light". Decides how the widget set derives its own shades. Left
# out, the background's brightness decides.
appearance = "dark"

# The window itself.
background = "#0e0e12"
# Sidebar and panels.
surface = "#15151b"
# Popovers, the composer, modals: anything that sits above the surface.
elevated = "#1d1d25"
# Inputs and code blocks: anything that sits below it.
sunken = "#0a0a0d"

border = "#26262f"
# The border of whatever holds keyboard focus.
border_focus = "#584a86"

# Body text.
text = "#e3e3ec"
# Timestamps and secondary labels.
text_dim = "#9d9dae"
# Placeholders and disabled controls.
text_muted = "#6a6a7b"

# Row and button states.
hover = "#1d1d25"
active = "#26262f"
selected = "#272040"

accent = "#a78bfa"
# Text drawn on top of the accent colour.
on_accent = "#120f1c"
success = "#6ee7a8"
warning = "#f3c46a"
danger = "#f87b8a"

# Sender colours, picked by a stable hash so one person keeps one colour in
# every conversation and across restarts. Any number of them.
#
# Optional, and best left out: leave this off -- as petunia's own dark and light
# do -- and a colour is generated per person from the whole hue wheel instead, so
# a group of twenty is twenty colours rather than the same few repeated.
accents = [
  "#a78bfa",
  "#6ee7a8",
  "#f3c46a",
  "#f99f6b",
  "#7cc4f8",
  "#5ed4c4",
  "#f58cc8",
  "#f87b8a",
]

[typography]
# Falls back to the system interface font if the family is not installed.
family = "Inter"
# Used for monospace message spans and code blocks.
mono = "JetBrains Mono"
# Points. Sidebar, headers, buttons.
ui_size = 13.0
# Points. Message bodies.
message_size = 14.0
# A multiple of the font size.
line_height = 1.55
