[package]
name = "petunia"
version = "0.1.0"
edition = "2024"

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
gpui = "0.2.2"
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
image = { version = "0.25", features = ["webp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
dirs = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
open = "5.4.0"
toml = "1.1.4"
notify = "8.2.0"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
# gpui-ce publishes to crates.io under a renamed package, but its in-tree crate
# is still `gpui` 0.2.2 -- so a plain `gpui = "0.2.2"` dependency resolves here.
# Both revs are pinned together: gpui-component's released 0.5.1 does not build
# against gpui-ce's HEAD, only its git main does.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "33ed975bf2dff2735eaa21366aa7fa19015c891c" }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
