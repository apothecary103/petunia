[package]
name = "petunia"
version = "0.1.0"
edition = "2024"

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "63482efd0cbdc0780baf0650517c7d55f1cac05d" }
# Deliberately unpinned: gpui-component declares the same bare git source, and
# cargo treats `git = url` and `git = url, rev = ...` as different sources --
# which silently builds two incompatible copies of gpui. Cargo.lock pins it.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "88f102d13654fe25aa2fede076274b6b751a3704" }
image = { version = "0.25", features = ["webp"] }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
dirs = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5.4.0"
toml = "1.1.4"
notify = "8.2.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2 = "0.6.4"
core-video = "0.5.2"
core-foundation = "0.10.1"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"
objc2-core-foundation = "0.3.2"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"
