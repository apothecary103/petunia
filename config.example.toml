# Petunia configuration.
#
# Copy to ~/.config/petunia/config.toml -- on every platform, macOS included.
# Every key is optional; anything you leave out keeps its default. A typo is
# reported in the app rather than being silently ignored, so an unknown key is
# an error, not a no-op.
#
# The file is watched: saving it applies the change immediately.

# Petunia's own "dark" and "light", or any of Zed's, which ship with it:
#   one-dark, one-light, ayu-dark, ayu-mirage, ayu-light,
#   gruvbox-dark, gruvbox-dark-hard, gruvbox-dark-soft,
#   gruvbox-light, gruvbox-light-hard, gruvbox-light-soft
# Any other name is read from ~/.config/petunia/themes/<name>.toml, which also
# overrides a built-in of the same name. Fonts and sizes live in the theme file;
# see themes.example.toml for the full set of keys.
theme = "dark"

# Multiplies every length in the interface, on top of whatever scaling your
# display already does. Raise it if everything looks too small. Clamped to
# 0.5 - 3.0, so a slip cannot leave a window you can no longer read.
scale = 1.0

[messages]
# How a message is shaped: "standard" (an avatar gutter and one header per run),
# "compact" (one line per message, IRC style) or "bubbles" (Signal's own, yours
# on the right). Independent of density, which is how much room it is given.
layout = "standard"
# "comfortable" or "compact".
density = "comfortable"
# "always", "hover" or "never".
timestamps = "always"
# Seconds. Messages from one sender closer together than this are grouped.
group_within = 300
date_separators = true
# Attribute your own messages by your profile name rather than as "You". Applies
# to mentions, quotes and reactions as well as to the run header.
show_own_name = false

[sidebar]
# Also what dragging the list's right edge sets. Between 180 and 480; dragged
# narrower than that the list collapses to a rail of avatars, which is remembered
# separately in session.json rather than as a width.
width = 240.0
# "recent" or "name".
sort = "recent"
show_preview = true
# Lets the desktop show through the conversation list, blurred, as the system's
# own sidebars do. macOS only, and takes effect on restart: the blur is a
# property of the window, not of the list.
translucent = true

[media]
# Fetched without asking. Signal's CDN expires attachments after a few weeks,
# so anything not downloaded while it is fresh is gone for good.
auto_download_images = true
auto_download_audio = true
auto_download_video = true
# Megabytes. Anything larger waits for you to ask.
auto_download_limit = 8
# Megabytes of cached media to keep before the oldest is dropped.
cache_limit = 2048
# Inline pictures are scaled down to fit inside both of these, keeping their
# aspect ratio, and are never scaled up.
image_max_width = 400.0
image_max_height = 300.0

[notifications]
enabled = true
show_content = true
show_sender = true
# "all", "mentions" or "none".
groups = "all"

# Rebinding one key leaves the rest alone. "cmd" is the command key on macOS and
# control elsewhere, so one file works on both. Set a binding to "none" to
# remove it. Press cmd+/ in the app for the current list.
[keys]
# Where the bindings start from: "standard", "emacs" or "vim". Anything below
# merges on top, so a preset is a starting point rather than a cage.
# preset = "standard"
# quick-switcher = "cmd+k"
# search = "cmd+f"
# search-thread = "cmd+shift+f"
# focus-composer = "cmd+l"
# toggle-sidebar = "cmd+b"
# toggle-details = "cmd+i"
# scroll-up = "pageup"
# scroll-down = "pagedown"
# scroll-to-top = "cmd+home"
# scroll-to-bottom = "cmd+end"
# next-unread = "cmd+j"
# next-conversation = "cmd+shift+down"
# previous-conversation = "cmd+shift+up"
# mark-read = "cmd+shift+r"
# reply-to-last = "cmd+r"
# edit-last = "cmd+e"
# attach-file = "cmd+u"
# cancel = "escape"
# help = "cmd+/"
# settings = "cmd+,"
# theme-picker = "cmd+shift+t"
